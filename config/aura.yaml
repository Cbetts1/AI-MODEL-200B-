# config/aura.yaml — Main runtime configuration for AURA.
#
# Edit this file to configure the model backend, memory path, and features.
# Do NOT commit secrets (API keys) to version control — use environment
# variables or a separate secrets.yaml (git-ignored).

# ── Model backend ──────────────────────────────────────────────────────────────
model:
  # "echo"   → offline echo backend for testing (no model server required)
  # "local"  → run inference on this machine (requires llama-cpp-python or Ollama)
  # "remote" → call an OpenAI-compatible HTTP endpoint
  # "router" → try a prioritised list of backends (best for 200B-class quality)
  # "free"   → auto-configure all free 200B-class cloud services from env vars
  backend: free

  local:
    # "llamacpp" uses llama-cpp-python; "ollama" uses the Ollama client + server.
    engine: llamacpp
    model_path: models/weights/model.gguf
    context_length: 4096
    n_threads: 4         # set to your CPU core count

  remote:
    # Works with: OpenAI, Ollama (localhost), LM Studio, vLLM, LocalAI, etc.
    base_url: http://localhost:11434/v1
    api_key: ""          # leave blank for local servers; or use $OPENAI_API_KEY
    model_name: llama3
    temperature: 0.7
    max_tokens: 4096

  # ── Model Router — free 200B-class cloud services ────────────────────────
  # When backend is "router", AURA tries each entry in order and uses the
  # first one that succeeds.  Set one or more API keys as environment variables
  # to unlock that backend (they're all free-tier or have free credits):
  #
  #   export GROQ_API_KEY=gsk_...         # https://console.groq.com (free)
  #   export CEREBRAS_API_KEY=csk_...     # https://inference.cerebras.ai (free)
  #   export OPENROUTER_API_KEY=sk-or-... # https://openrouter.ai (free models)
  #   export TOGETHER_API_KEY=...         # https://api.together.xyz (free credits)
  #   export HUGGINGFACE_API_KEY=hf_...   # https://huggingface.co/settings/tokens
  #
  # No key = that backend is skipped; if ALL are unset the echo backend is used.
  router:
    - name: groq
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      model_name: llama-3.3-70b-versatile
      temperature: 0.7
      max_tokens: 4096
    - name: cerebras
      base_url: https://api.cerebras.ai/v1
      api_key_env: CEREBRAS_API_KEY
      model_name: llama-3.3-70b
      temperature: 0.7
      max_tokens: 4096
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model_name: meta-llama/llama-3.3-70b-instruct:free
      temperature: 0.7
      max_tokens: 4096
    - name: together
      base_url: https://api.together.xyz/v1
      api_key_env: TOGETHER_API_KEY
      model_name: meta-llama/Llama-3.3-70B-Instruct-Turbo
      temperature: 0.7
      max_tokens: 4096
    - name: huggingface
      base_url: https://api-inference.huggingface.co/v1
      api_key_env: HUGGINGFACE_API_KEY
      model_name: microsoft/Phi-4
      temperature: 0.7
      max_tokens: 2048
    - name: echo
      base_url: ""     # always available — offline fallback

  # ── Model scaling presets ─────────────────────────────────────────────────
  # Choose a preset to automatically configure context length, max_tokens,
  # and recommended hardware.  Override individual settings above as needed.
  #
  # Presets:
  #   small   — 7B params, 4K context, runs on 8GB RAM / mobile
  #   medium  — 13-34B params, 8K context, runs on 16GB RAM / laptop
  #   large   — 70B params, 16K context, runs on 32GB+ RAM / desktop GPU
  #   max     — 200B+ params, 32K+ context, cloud GPU cluster recommended
  #             (free via Groq/Cerebras/OpenRouter — no local hardware needed)
  #
  # The preset is informational — AURA works with any model size.
  # Set backend to "free" or "router" and add your API keys for best results.
  preset: max

# ── Memory ─────────────────────────────────────────────────────────────────────
memory:
  # Directory where session history files are stored.
  # Default: ~/.aura/memory/
  dir: ~/.aura/memory

# ── Identity ───────────────────────────────────────────────────────────────────
identity:
  config_path: config/identity.yaml

# ── HTTP API server ────────────────────────────────────────────────────────────
# AURA is cloud-native: run `aura serve` to start the API so it can be
# accessed from web pages, other servers, or any device on the network.
# The web chat UI is served at the root URL (/).
server:
  host: 0.0.0.0         # "0.0.0.0" to listen on all interfaces
  port: 8000
  # Set to a non-empty string to require an Authorization: Bearer <token> header.
  # Use $AURA_API_TOKEN env var in production — never commit real tokens.
  api_token: ""

# ── Admin API ──────────────────────────────────────────────────────────────────
# Set AURA_ADMIN_TOKEN to a strong random string to enable the admin dashboard
# and remote-maintenance API at /admin.
#
# The admin API provides:
#   - System metrics (uptime, memory, Python version)
#   - Model / cloud-backend status and reconnect
#   - Server log tail
#   - Runtime config reload
#   - Graceful restart signalling
#
# NEVER commit a real token to version control.  Use the environment variable:
#   export AURA_ADMIN_TOKEN=$(python3 -c "import secrets; print(secrets.token_hex(32))")
admin:
  # Leave empty to disable admin endpoints entirely.
  # In production always use the env var: $AURA_ADMIN_TOKEN
  admin_token: ""

# ── Features ───────────────────────────────────────────────────────────────────
features:
  voice: true           # Web Speech API voice input (browser native)
  video: false          # set true when video integration is ready
  screen_share: false   # set true when screen-share integration is ready
  web_ui: true          # serve the web chat interface at /
  templates: true       # enable pre-fab template system (20 built-in)
  streaming: true       # SSE streaming via /v1/chat/stream
  agent_loop: true      # multi-step agentic tool use
